openapi: 3.1.0
info:
  title: Limit Breaker API
  version: 1.0.0
  description: |
    Contrato único entre el frontend (Next.js) y el backend (NestJS) del sistema de gestión del gimnasio Limit Breaker.

    Convenciones
    - Autenticación: `Authorization: Bearer <accessToken>` (JWT emitido por Nest). Refresh por `POST /auth/refresh`.
    - Autorización: cada operación declara `x-roles` con los roles permitidos. Fuera de ellos → 403.
    - Fechas de negocio: `YYYY-MM-DD` (zona America/Argentina/Buenos_Aires). Marcas de tiempo: ISO 8601 con zona.
    - Montos: números decimales en ARS (`number`, 2 decimales).
    - Paginación: `page` (desde 1) y `pageSize` (1..100, default 25). Respuesta `{ items, page, pageSize, total }`.
    - Listas con totales: la propiedad `totals` se calcula en el backend sobre el MISMO filtro que `items`, nunca sobre la página.
    - Errores: `ErrorResponse` con `code` estable para que el front traduzca.
    - Cuando `mustChangePassword` es true, todo endpoint fuera de `/auth/*` devuelve 403 `PASSWORD_CHANGE_REQUIRED`.
    - Confirmación de contraseña (decisión D5): crear, editar o anular un egreso exige `confirmPassword` con la contraseña del usuario autenticado. Si no coincide → 403 `PASSWORD_CONFIRMATION_INVALID` (no 401, para que el front no intente refrescar el token ni cierre la sesión). 5 fallos en 15 min → 429. La auditoría registra `passwordConfirmed = true`.
    - Etiquetas en español de enums (métodos, etapas, estados) viven en el paquete compartido `labels`, no en la API.
servers:
  - url: http://localhost:3000/api/v1
    description: Desarrollo
  - url: https://{host}/api/v1
    description: Producción
    variables:
      host:
        default: api.limitbreaker.example
tags:
  - name: Auth
  - name: Users
  - name: Plans
  - name: Members
  - name: Memberships
  - name: Attendances
  - name: Cash
  - name: Metrics
  - name: Nutrition
  - name: Leads
  - name: Audit
  - name: Settings
  - name: Staff
  - name: Incentives
  - name: System
security:
  - bearerAuth: []

paths:
  /health:
    get:
      tags: [System]
      summary: Estado del servicio
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  version: { type: string }
                  time: { type: string, format: date-time }

  # ───────────────────────── AUTH ─────────────────────────
  /auth/login:
    post:
      tags: [Auth]
      summary: Iniciar sesión
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Sesión iniciada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/refresh:
    post:
      tags: [Auth]
      summary: Renovar tokens (rotación de refresh)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '200':
          description: Nuevo par de tokens
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthTokens' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/logout:
    post:
      tags: [Auth]
      summary: Cerrar sesión (revoca el refresh token)
      x-roles: [ADMIN, RECEPCIONISTA, NUTRICIONISTA, ALUMNO]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '204': { description: Sesión cerrada }
  /auth/change-password:
    post:
      tags: [Auth]
      summary: Cambiar la propia contraseña (obligatorio en el primer login)
      x-roles: [ADMIN, RECEPCIONISTA, NUTRICIONISTA, ALUMNO]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string }
                newPassword:
                  type: string
                  minLength: 10
                  description: Mínimo 10 caracteres, al menos una letra y un número, distinta de la actual.
      responses:
        '200':
          description: Contraseña cambiada; se emite un nuevo par de tokens y se revocan los anteriores
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthTokens' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/me:
    get:
      tags: [Auth]
      summary: Perfil del usuario autenticado
      x-roles: [ADMIN, RECEPCIONISTA, NUTRICIONISTA, ALUMNO]
      responses:
        '200':
          description: Perfil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }

  # ───────────────────────── USERS ─────────────────────────
  /users:
    get:
      tags: [Users]
      summary: Listar usuarios
      x-roles: [ADMIN]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - in: query
          name: role
          schema: { $ref: '#/components/schemas/Role' }
        - in: query
          name: isActive
          schema: { type: boolean }
      responses:
        '200':
          description: Página de usuarios
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/User' }
    post:
      tags: [Users]
      summary: Crear usuario con contraseña temporal
      x-roles: [ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateUserRequest' }
      responses:
        '201':
          description: Usuario creado. `temporaryPassword` se devuelve una única vez.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatedUserResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { $ref: '#/components/responses/Conflict' }
  /users/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Users]
      summary: Detalle de usuario
      x-roles: [ADMIN]
      responses:
        '200': { description: Usuario, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Users]
      summary: Editar nombre, rol o estado activo
      x-roles: [ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateUserRequest' }
      responses:
        '200': { description: Usuario actualizado, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409':
          description: No se puede desactivar o degradar al último ADMIN activo ni a sí mismo (`LAST_ADMIN`, `SELF_MODIFICATION`)
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
  /users/{id}/reset-password:
    post:
      tags: [Users]
      summary: Generar nueva contraseña temporal
      x-roles: [ADMIN]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: Nueva contraseña temporal (una sola vez); `mustChangePassword` pasa a true y se revocan sesiones
          content:
            application/json:
              schema:
                type: object
                properties:
                  temporaryPassword: { type: string }

  # ───────────────────────── PLANS ─────────────────────────
  /plans:
    get:
      tags: [Plans]
      summary: Listar planes
      x-roles: [ADMIN, RECEPCIONISTA, NUTRICIONISTA]
      parameters:
        - in: query
          name: includeInactive
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Planes
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Plan' }
    post:
      tags: [Plans]
      summary: Crear plan
      x-roles: [ADMIN]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PlanInput' } } }
      responses:
        '201': { description: Creado, content: { application/json: { schema: { $ref: '#/components/schemas/Plan' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
  /plans/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    patch:
      tags: [Plans]
      summary: Editar plan (precio, duración sugerida, activo, cobro de nutrición…)
      x-roles: [ADMIN]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PlanInput' } } }
      responses:
        '200': { description: Actualizado, content: { application/json: { schema: { $ref: '#/components/schemas/Plan' } } } }
        '404': { $ref: '#/components/responses/NotFound' }

  # ───────────────────────── MEMBERS ─────────────────────────
  /members:
    get:
      tags: [Members]
      summary: Listar socios (padrón) con estado de cuota
      description: Orden por defecto `renewalStatus` (EXPIRED → DUE_TODAY → DUE_3D → DUE_7D → OK → UNKNOWN → CANCELLED), luego apellido y nombre. Replica `getRenovacionesData` con paginación y filtros en servidor.
      x-roles: [ADMIN, RECEPCIONISTA]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - in: query
          name: q
          description: Búsqueda por nombre, apellido o código (sin acentos/mayúsculas)
          schema: { type: string, maxLength: 80 }
        - in: query
          name: status
          description: Estado del padrón. Default `ACTIVE`.
          schema: { $ref: '#/components/schemas/MemberStatus' }
        - in: query
          name: renewalStatus
          description: Filtro por estado de cuota (uno o varios)
          schema:
            type: array
            items: { $ref: '#/components/schemas/RenewalStatus' }
          style: form
          explode: false
        - in: query
          name: planId
          schema: { type: string, format: uuid }
        - in: query
          name: renewedFrom
          schema: { type: string, format: date }
        - in: query
          name: renewedTo
          schema: { type: string, format: date }
        - in: query
          name: sort
          schema:
            type: string
            enum: [priority, lastName, expiresAt, lastRenewalAt, joinedAt]
            default: priority
        - in: query
          name: order
          schema: { type: string, enum: [asc, desc], default: asc }
      responses:
        '200':
          description: Página de socios
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Member' }
    post:
      tags: [Members]
      summary: Alta de socio (con pago inicial opcional)
      description: Replica `crearSocio`. Si `initialPayment` está presente se crea la membresía y el movimiento de caja en la misma transacción. `soldByStaffId` registra quién cerró la venta (Fase 4); por defecto, la persona vinculada al usuario autenticado.
      x-roles: [ADMIN, RECEPCIONISTA]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateMemberRequest' } } }
      responses:
        '201':
          description: Socio creado
          content:
            application/json:
              schema:
                type: object
                properties:
                  member: { $ref: '#/components/schemas/Member' }
                  membership: { $ref: '#/components/schemas/Membership' }
                  warnings: { type: array, items: { type: string } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409':
          description: Ya existe un socio con ese nombre y apellido (`MEMBER_NAME_EXISTS`, `details.existingLegacyCode`)
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
  /members/summary:
    get:
      tags: [Members]
      summary: Tarjetas del padrón (conteos sobre todo el padrón)
      x-roles: [ADMIN, RECEPCIONISTA]
      responses:
        '200':
          description: Conteos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberSummary' }
  /members/auto-cancellations:
    post:
      tags: [Members]
      summary: Aplicar bajas automáticas por inactividad (también corre por cron diario)
      x-roles: [ADMIN]
      responses:
        '200':
          description: Resultado
          content:
            application/json:
              schema:
                type: object
                properties:
                  applied: { type: integer }
                  thresholdDays: { type: integer }
                  members:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        legacyCode: { type: string }
                        fullName: { type: string }
                        expiresAt: { type: string, format: date }
  /members/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Members]
      summary: Ficha del socio
      x-roles: [ADMIN, RECEPCIONISTA]
      responses:
        '200': { description: Detalle, content: { application/json: { schema: { $ref: '#/components/schemas/MemberDetail' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Members]
      summary: Editar datos del socio
      description: Replica `editarSocio` (sin estado; baja y reactivación tienen endpoints propios). Cambiar `currentPlanId` no genera pago. `soldByStaffId` solo lo puede cambiar el ADMIN (403 para otros roles).
      x-roles: [ADMIN, RECEPCIONISTA]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UpdateMemberRequest' } } }
      responses:
        '200': { description: Actualizado, content: { application/json: { schema: { $ref: '#/components/schemas/Member' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Members]
      summary: Anular socio creado por error (baja lógica)
      x-roles: [ADMIN]
      responses:
        '204': { description: Anulado }
        '409':
          description: El socio tiene movimientos o asistencias activas (`MEMBER_HAS_ACTIVITY`)
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
  /members/{id}/cancel:
    post:
      tags: [Members]
      summary: Dar de baja
      x-roles: [ADMIN, RECEPCIONISTA]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 200 }
                effectiveOn: { type: string, format: date, description: Default hoy }
      responses:
        '200': { description: Socio dado de baja, content: { application/json: { schema: { $ref: '#/components/schemas/Member' } } } }
        '409': { description: Ya estaba de baja (`MEMBER_ALREADY_CANCELLED`), content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  /members/{id}/reactivate:
    post:
      tags: [Members]
      summary: Reactivar socio de baja (no modifica vencimiento)
      x-roles: [ADMIN, RECEPCIONISTA]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: Reactivado, content: { application/json: { schema: { $ref: '#/components/schemas/Member' } } } }
        '409': { description: Ya estaba activo (`MEMBER_ALREADY_ACTIVE`), content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  /members/{id}/whatsapp-link:
    get:
      tags: [Members]
      summary: Link de WhatsApp con plantilla
      x-roles: [ADMIN, RECEPCIONISTA]
      parameters:
        - $ref: '#/components/parameters/Id'
        - in: query
          name: template
          required: true
          schema:
            type: string
            enum: [vencimiento, reactivacion, ausente, inasistencia_alta, inasistencia_critica]
      responses:
        '200':
          description: URL lista para abrir
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: { type: string, format: uri }
                  message: { type: string }
        '409': { description: Socio sin teléfono válido (`MEMBER_PHONE_INVALID`), content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  /members/{id}/memberships:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Memberships]
      summary: Historial de renovaciones del socio
      x-roles: [ADMIN, RECEPCIONISTA]
      parameters:
        - in: query
          name: includeVoided
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Renovaciones
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Membership' }
    post:
      tags: [Memberships]
      summary: Registrar renovación (cobro de membresía)
      description: Replica `registrarRenovacion`. Crea membresía + movimiento de caja INCOME/Renovación con splits; actualiza plan, última renovación y vencimiento del socio; reactiva si estaba de baja.
      x-roles: [ADMIN, RECEPCIONISTA]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateMembershipRequest' } } }
      responses:
        '201':
          description: Renovación registrada
          content:
            application/json:
              schema:
                type: object
                properties:
                  membership: { $ref: '#/components/schemas/Membership' }
                  member: { $ref: '#/components/schemas/Member' }
                  warnings: { type: array, items: { type: string } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
  /members/{id}/attendances:
    get:
      tags: [Attendances]
      summary: Asistencias del socio
      x-roles: [ADMIN, RECEPCIONISTA]
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Página
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/Attendance' } }
  /members/{id}/status-events:
    get:
      tags: [Members]
      summary: Historial de altas, bajas y reactivaciones
      x-roles: [ADMIN, RECEPCIONISTA]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: Eventos
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MemberStatusEvent' }

  # ───────────────────────── MEMBERSHIPS ─────────────────────────
  /memberships:
    get:
      tags: [Memberships]
      summary: Listar renovaciones con total del filtro
      x-roles: [ADMIN, RECEPCIONISTA]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - { in: query, name: memberId, schema: { type: string, format: uuid } }
        - { in: query, name: from, schema: { type: string, format: date }, description: 'startsOn >= from' }
        - { in: query, name: to, schema: { type: string, format: date }, description: 'startsOn <= to' }
        - { in: query, name: planId, schema: { type: string, format: uuid } }
        - { in: query, name: method, schema: { $ref: '#/components/schemas/PaymentMethod' } }
        - { in: query, name: status, schema: { $ref: '#/components/schemas/RecordStatus' } }
      responses:
        '200':
          description: Página con totales
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/Membership' } }
                      totals:
                        type: object
                        properties:
                          count: { type: integer }
                          amountTotal: { type: number }
                          avgTicket: { type: number, nullable: true }
  /memberships/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Memberships]
      summary: Detalle de renovación
      x-roles: [ADMIN, RECEPCIONISTA]
      responses:
        '200': { description: Renovación, content: { application/json: { schema: { $ref: '#/components/schemas/Membership' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Memberships]
      summary: Editar renovación (plan, fechas, splits, notas)
      x-roles: [ADMIN, RECEPCIONISTA]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UpdateMembershipRequest' } } }
      responses:
        '200': { description: Actualizada, content: { application/json: { schema: { $ref: '#/components/schemas/Membership' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { description: Está anulada (`RECORD_VOIDED`), content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  /memberships/{id}/void:
    post:
      tags: [Memberships]
      summary: Anular renovación (y su movimiento de caja)
      x-roles: [ADMIN, RECEPCIONISTA]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/VoidRequest' } } }
      responses:
        '200': { description: Anulada; el socio vuelve a su membresía anterior, content: { application/json: { schema: { $ref: '#/components/schemas/Membership' } } } }
        '409': { description: Ya anulada, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }

  # ───────────────────────── ATTENDANCES ─────────────────────────
  /attendances:
    get:
      tags: [Attendances]
      summary: Listar asistencias
      x-roles: [ADMIN, RECEPCIONISTA]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - { in: query, name: from, schema: { type: string, format: date } }
        - { in: query, name: to, schema: { type: string, format: date } }
        - { in: query, name: memberId, schema: { type: string, format: uuid } }
        - { in: query, name: status, schema: { $ref: '#/components/schemas/RecordStatus' } }
      responses:
        '200':
          description: Página
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/Attendance' } }
                      totals:
                        type: object
                        properties:
                          count: { type: integer }
                          distinctMembers: { type: integer }
    post:
      tags: [Attendances]
      summary: Registrar check-in
      description: Replica `registrarAsistencia`. Sin `checkedInAt` usa la hora del servidor. Si el socio ya tiene check-in ese día responde 409 salvo `force = true`.
      x-roles: [ADMIN, RECEPCIONISTA]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateAttendanceRequest' } } }
      responses:
        '201': { description: Registrada, content: { application/json: { schema: { $ref: '#/components/schemas/Attendance' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409':
          description: Duplicado el mismo día (`DUPLICATE_CHECKIN`, `details.existingCheckedInAt`) o socio de baja (`MEMBER_CANCELLED`)
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
  /attendances/search-members:
    get:
      tags: [Attendances]
      summary: Autocompletado de socios para el check-in (no De baja; marca cuota vencida)
      x-roles: [ADMIN, RECEPCIONISTA]
      parameters:
        - { in: query, name: q, required: true, schema: { type: string, minLength: 1, maxLength: 80 } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 20, default: 8 } }
      responses:
        '200':
          description: Sugerencias
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string, format: uuid }
                    legacyCode: { type: string }
                    fullName: { type: string }
                    planName: { type: string, nullable: true }
                    renewalStatus: { $ref: '#/components/schemas/RenewalStatus' }
                    isUpToDate: { type: boolean }
                    lastCheckInToday: { type: string, format: date-time, nullable: true }
  /attendances/risk:
    get:
      tags: [Attendances]
      summary: Socios activos con cuota al día y su riesgo de inasistencia
      x-roles: [ADMIN, RECEPCIONISTA]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - in: query
          name: risk
          schema:
            type: array
            items: { $ref: '#/components/schemas/AttendanceRisk' }
          style: form
          explode: false
        - { in: query, name: q, schema: { type: string } }
      responses:
        '200':
          description: Página ordenada por riesgo desc
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/AttendanceRiskRow' } }
  /attendances/summary:
    get:
      tags: [Attendances]
      summary: Tarjetas de inasistencia
      x-roles: [ADMIN, RECEPCIONISTA]
      responses:
        '200':
          description: Conteos
          content:
            application/json:
              schema:
                type: object
                properties:
                  activeUpToDate: { type: integer }
                  ok: { type: integer }
                  medium: { type: integer }
                  high: { type: integer }
                  critical: { type: integer }
                  noAttendance: { type: integer }
                  todayCheckIns: { type: integer }
                  thresholds: { type: array, items: { type: integer }, example: [7, 14, 20] }
  /attendances/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    patch:
      tags: [Attendances]
      summary: Corregir asistencia (socio, fecha/hora, nota)
      x-roles: [ADMIN, RECEPCIONISTA]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                memberId: { type: string, format: uuid }
                checkedInAt: { type: string, format: date-time }
                notes: { type: string, maxLength: 300 }
      responses:
        '200': { description: Actualizada, content: { application/json: { schema: { $ref: '#/components/schemas/Attendance' } } } }
        '409': { description: Anulada, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  /attendances/{id}/void:
    post:
      tags: [Attendances]
      summary: Anular asistencia
      x-roles: [ADMIN, RECEPCIONISTA]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/VoidRequest' } } }
      responses:
        '200': { description: Anulada, content: { application/json: { schema: { $ref: '#/components/schemas/Attendance' } } } }

  # ───────────────────────── CASH ─────────────────────────
  /cash/movements:
    get:
      tags: [Cash]
      summary: Movimientos de caja con totales del filtro
      description: Unifica renovaciones (origin RENEWAL) e ingresos/egresos manuales. `totals` se calcula sobre el mismo filtro que `items` (nunca sobre la página). Sin `from`/`to` usa el mes actual.
      x-roles: [ADMIN, RECEPCIONISTA]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - { in: query, name: from, schema: { type: string, format: date } }
        - { in: query, name: to, schema: { type: string, format: date } }
        - { in: query, name: type, schema: { $ref: '#/components/schemas/MovementType' } }
        - { in: query, name: categoryId, schema: { type: string, format: uuid } }
        - { in: query, name: method, schema: { $ref: '#/components/schemas/PaymentMethod' } }
        - { in: query, name: origin, schema: { $ref: '#/components/schemas/MovementOrigin' } }
        - { in: query, name: memberId, schema: { type: string, format: uuid } }
        - { in: query, name: q, schema: { type: string, maxLength: 80 }, description: 'Busca en descripción, subcategoría, código y socio' }
        - { in: query, name: createdBy, schema: { type: string, format: uuid }, description: 'Usuario que registró el movimiento (columna Registrado por)' }
        - { in: query, name: status, schema: { $ref: '#/components/schemas/RecordStatus' }, description: Default ACTIVE }
        - { in: query, name: expandSplits, schema: { type: boolean, default: true }, description: 'true: una fila por split (como legacy); false: una fila por movimiento' }
      responses:
        '200':
          description: Página con totales
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/CashMovementRow' } }
                      totals: { $ref: '#/components/schemas/CashTotals' }
                      range:
                        type: object
                        properties:
                          from: { type: string, format: date }
                          to: { type: string, format: date }
    post:
      tags: [Cash]
      summary: Registrar ingreso o egreso manual
      description: 'Replica `registrarMovimiento` y `validarPasswordEgreso`. Un egreso exige `confirmPassword` con la contraseña del propio usuario autenticado (decisión D5); ya no hay contraseña compartida. El movimiento queda con `createdBy` = ese usuario.'
      x-roles: [ADMIN, RECEPCIONISTA]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateCashMovementRequest' } } }
      responses:
        '201': { description: Creado, content: { application/json: { schema: { $ref: '#/components/schemas/CashMovement' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/PasswordConfirmationInvalid' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '409': { description: Categoría inactiva o de sistema (`CATEGORY_NOT_ALLOWED`), content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  /cash/movements/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Cash]
      summary: Detalle del movimiento
      x-roles: [ADMIN, RECEPCIONISTA]
      responses:
        '200': { description: Movimiento, content: { application/json: { schema: { $ref: '#/components/schemas/CashMovement' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Cash]
      summary: Editar movimiento manual
      description: 'Un movimiento de origen RENEWAL se edita desde `PATCH /memberships/{id}` (409 `EDIT_VIA_MEMBERSHIP`). Editar un egreso exige `confirmPassword` (D5).'
      x-roles: [ADMIN, RECEPCIONISTA]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UpdateCashMovementRequest' } } }
      responses:
        '200': { description: Actualizado, content: { application/json: { schema: { $ref: '#/components/schemas/CashMovement' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/PasswordConfirmationInvalid' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /cash/movements/{id}/void:
    post:
      tags: [Cash]
      summary: Anular movimiento manual
      description: 'Un movimiento RENEWAL se anula desde `POST /memberships/{id}/void` (409 `VOID_VIA_MEMBERSHIP`). Anular un egreso exige `confirmPassword` (D5).'
      x-roles: [ADMIN, RECEPCIONISTA]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CashVoidRequest' } } }
      responses:
        '200': { description: Anulado, content: { application/json: { schema: { $ref: '#/components/schemas/CashMovement' } } } }
        '403': { $ref: '#/components/responses/PasswordConfirmationInvalid' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /cash/summary:
    get:
      tags: [Cash]
      summary: KPIs y breakdowns del período (sin paginar)
      description: Replica los KPIs y tablas de `getCajaData`. Acepta los mismos filtros que `/cash/movements`.
      x-roles: [ADMIN, RECEPCIONISTA]
      parameters:
        - { in: query, name: from, schema: { type: string, format: date } }
        - { in: query, name: to, schema: { type: string, format: date } }
        - { in: query, name: type, schema: { $ref: '#/components/schemas/MovementType' } }
        - { in: query, name: categoryId, schema: { type: string, format: uuid } }
        - { in: query, name: method, schema: { $ref: '#/components/schemas/PaymentMethod' } }
        - { in: query, name: memberId, schema: { type: string, format: uuid } }
        - { in: query, name: q, schema: { type: string } }
      responses:
        '200':
          description: Totales y breakdowns
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CashTotals' }
  /cash/categories:
    get:
      tags: [Cash]
      summary: Categorías de movimientos
      x-roles: [ADMIN, RECEPCIONISTA]
      parameters:
        - { in: query, name: type, schema: { $ref: '#/components/schemas/MovementType' } }
        - { in: query, name: includeInactive, schema: { type: boolean, default: false } }
      responses:
        '200':
          description: Categorías
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/CashCategory' } }
    post:
      tags: [Cash]
      summary: Crear categoría
      x-roles: [ADMIN]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CashCategoryInput' } } }
      responses:
        '201': { description: Creada, content: { application/json: { schema: { $ref: '#/components/schemas/CashCategory' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
  /cash/categories/{id}:
    patch:
      tags: [Cash]
      summary: Editar / activar / desactivar categoría
      x-roles: [ADMIN]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CashCategoryInput' } } }
      responses:
        '200': { description: Actualizada, content: { application/json: { schema: { $ref: '#/components/schemas/CashCategory' } } } }
        '409': { description: Categoría de sistema (`SYSTEM_CATEGORY`), content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }

  # ───────────────────────── METRICS (P&L) ─────────────────────────
  /metrics/months:
    get:
      tags: [Metrics]
      summary: Períodos disponibles para el selector
      x-roles: [ADMIN]
      responses:
        '200':
          description: Lista descendente desde el mes actual hasta el primer mes con datos
          content:
            application/json:
              schema:
                type: object
                properties:
                  cutoverPeriod: { type: string, example: '2026-11' }
                  periods:
                    type: array
                    items: { $ref: '#/components/schemas/PeriodInfo' }
  /metrics/monthly:
    get:
      tags: [Metrics]
      summary: Vista del mes (P&L)
      description: Replica `getPnLData`. Si el período tiene snapshot vigente devuelve sus valores (`source = SNAPSHOT`); si no, calcula en vivo con V1. Incluye el mes anterior para comparativo, parámetros usados y métricas de leads y asistencia.
      x-roles: [ADMIN]
      parameters:
        - $ref: '#/components/parameters/Period'
      responses:
        '200':
          description: Métricas del mes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MonthlyMetrics' }
        '400': { $ref: '#/components/responses/ValidationError' }
  /metrics/history:
    get:
      tags: [Metrics]
      summary: Series mensuales para la vista histórica
      x-roles: [ADMIN]
      parameters:
        - { in: query, name: from, schema: { type: string, pattern: '^\d{4}-\d{2}$' }, description: Default primer mes con datos }
        - { in: query, name: to, schema: { type: string, pattern: '^\d{4}-\d{2}$' }, description: Default mes actual }
        - in: query
          name: keys
          description: Claves de métrica a incluir; default todas las de nivel superior
          schema: { type: array, items: { type: string } }
          style: form
          explode: false
      responses:
        '200':
          description: Series
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MetricsHistory' }
  /metrics/definitions:
    get:
      tags: [Metrics]
      summary: Catálogo de métricas (texto para los íconos de información)
      x-roles: [ADMIN]
      responses:
        '200':
          description: Definiciones
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MetricDefinition' }
  /metrics/snapshots:
    get:
      tags: [Metrics]
      summary: Historial de cierres (vigentes y reemplazados)
      x-roles: [ADMIN]
      parameters:
        - { in: query, name: period, schema: { type: string, pattern: '^\d{4}-\d{2}$' } }
      responses:
        '200':
          description: Snapshots
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/MetricSnapshotInfo' } }
  /metrics/close:
    post:
      tags: [Metrics]
      summary: Recalcular el cierre de un mes (ADMIN)
      description: 'El cierre normal es automático: preliminar el último día a las 23:59 y definitivo el día gracia + 1 a las 00:05 (03 §0 regla 5). Este endpoint solo recalcula un mes ya terminado, por ejemplo tras corregir un pago. Si ya existe cierre vigente requiere `replace = true`; el anterior queda como historial y se audita `CLOSE_PERIOD`. Un período anterior al corte con foto legacy congelada no se puede recalcular (409 `LEGACY_PERIOD_FROZEN`), salvo que se confirme la propuesta 03 §6b.'
      x-roles: [ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [period]
              properties:
                period: { type: string, pattern: '^\d{4}-\d{2}$' }
                replace: { type: boolean, default: false }
                notes: { type: string, maxLength: 300 }
      responses:
        '201':
          description: Snapshot creado
          content:
            application/json:
              schema:
                type: object
                properties:
                  snapshot: { $ref: '#/components/schemas/MetricSnapshotInfo' }
                  metrics: { $ref: '#/components/schemas/MonthlyMetrics' }
                  warnings: { type: array, items: { type: string }, description: p. ej. churn provisional }
        '409':
          description: Ya cerrado sin `replace` (`PERIOD_ALREADY_CLOSED`), período futuro (`PERIOD_IN_FUTURE`) o legacy congelado (`LEGACY_PERIOD_FROZEN`)
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }

  # ───────────────────────── NUTRITION ─────────────────────────
  /nutrition/members:
    get:
      tags: [Nutrition]
      summary: Socios con plan contratado y responsable del honorario de nutrición (solo lectura)
      description: 'El plan sale de la renovación vigente del socio. Regla D4: plan NutriPlan (código FULLNUTR, "Full Nutrition" en el Excel) → `GYM` (lo cobra el gimnasio); cualquier otro plan → `NUTRITIONIST` (lo cobra la nutricionista). Sin datos financieros.'
      x-roles: [NUTRICIONISTA, ADMIN]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - { in: query, name: q, schema: { type: string } }
        - { in: query, name: status, schema: { $ref: '#/components/schemas/MemberStatus' }, description: Default ACTIVE }
        - { in: query, name: nutritionBilling, schema: { $ref: '#/components/schemas/NutritionBilling' } }
      responses:
        '200':
          description: Página
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/NutritionMemberRow' } }

  # ───────────────────────── LEADS ─────────────────────────
  /leads:
    get:
      tags: [Leads]
      summary: Tablero de leads
      description: Replica `getLeadsData`. Default últimos `leads.visible_days` días; `all = true` trae todo.
      x-roles: [ADMIN, RECEPCIONISTA]
      parameters:
        - { in: query, name: all, schema: { type: boolean, default: false } }
        - { in: query, name: stage, schema: { $ref: '#/components/schemas/LeadStage' } }
        - { in: query, name: q, schema: { type: string } }
      responses:
        '200':
          description: Leads agrupables por etapa
          content:
            application/json:
              schema:
                type: object
                properties:
                  stages: { type: array, items: { $ref: '#/components/schemas/LeadStage' }, description: Orden visual del tablero }
                  closedStages: { type: array, items: { $ref: '#/components/schemas/LeadStage' } }
                  visibleDays: { type: integer }
                  counts: { type: object, additionalProperties: { type: integer } }
                  items: { type: array, items: { $ref: '#/components/schemas/Lead' } }
    post:
      tags: [Leads]
      summary: Crear lead
      x-roles: [ADMIN, RECEPCIONISTA]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/LeadInput' } } }
      responses:
        '201': { description: Creado, content: { application/json: { schema: { $ref: '#/components/schemas/Lead' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
  /leads/summary:
    get:
      tags: [Leads]
      summary: Métricas de leads del período
      x-roles: [ADMIN, RECEPCIONISTA]
      parameters: [{ $ref: '#/components/parameters/Period' }]
      responses:
        '200':
          description: Métricas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LeadsSummary' }
  /leads/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    patch:
      tags: [Leads]
      summary: Editar lead
      x-roles: [ADMIN, RECEPCIONISTA]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/LeadInput' } } }
      responses:
        '200': { description: Actualizado, content: { application/json: { schema: { $ref: '#/components/schemas/Lead' } } } }
    delete:
      tags: [Leads]
      summary: Eliminar lead (baja lógica)
      x-roles: [ADMIN, RECEPCIONISTA]
      responses:
        '204': { description: Eliminado }
  /leads/{id}/stage:
    post:
      tags: [Leads]
      summary: Mover de etapa
      x-roles: [ADMIN, RECEPCIONISTA]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stage]
              properties:
                stage: { $ref: '#/components/schemas/LeadStage' }
                lostReason: { type: string, maxLength: 300, description: Obligatorio para LOST y NOT_INTERESTED }
                memberId: { type: string, format: uuid, description: Opcional al pasar a SIGNED_UP }
      responses:
        '200': { description: Actualizado, content: { application/json: { schema: { $ref: '#/components/schemas/Lead' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }

  # ───────────────────────── AUDIT ─────────────────────────
  /audit-logs:
    get:
      tags: [Audit]
      summary: Historial de auditoría
      description: 'Con `userId` funciona como historial de un usuario (pestaña Historial en el detalle de usuario), por ejemplo los egresos que registró una recepcionista.'
      x-roles: [ADMIN]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - { in: query, name: entity, schema: { $ref: '#/components/schemas/AuditEntity' } }
        - { in: query, name: entityId, schema: { type: string, format: uuid } }
        - { in: query, name: action, schema: { $ref: '#/components/schemas/AuditAction' } }
        - { in: query, name: userId, schema: { type: string, format: uuid } }
        - { in: query, name: from, schema: { type: string, format: date-time } }
        - { in: query, name: to, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: Página
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/AuditLog' } }

  # ───────────────────────── SETTINGS ─────────────────────────
  /settings:
    get:
      tags: [Settings]
      summary: Parámetros del negocio
      x-roles: [ADMIN]
      responses:
        '200':
          description: Parámetros
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Setting' } }
    patch:
      tags: [Settings]
      summary: Actualizar parámetros
      x-roles: [ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [values]
              properties:
                values:
                  type: object
                  additionalProperties: {}
                  example: { 'finance.market_rent': 1100000, 'metrics.renewal_grace_days': 15 }
      responses:
        '200':
          description: Parámetros actualizados
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Setting' } }
        '400': { $ref: '#/components/responses/ValidationError' }

  # ───────────────────────── STAFF (Fase 4) ─────────────────────────
  /staff-members:
    get:
      tags: [Staff]
      summary: Personas del equipo (para "Vendido por" y bonos)
      description: 'Incluye a quienes no tienen usuario (Aileen) y a quienes no cobran bono (Giovanni, Lucas). Orden: `sortOrder`, luego nombre.'
      x-roles: [ADMIN]
      parameters:
        - in: query
          name: includeInactive
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Equipo
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/StaffMember' } }
    post:
      tags: [Staff]
      summary: Agregar una persona al equipo
      x-roles: [ADMIN]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/StaffMemberInput' } } }
      responses:
        '201': { description: Creada, content: { application/json: { schema: { $ref: '#/components/schemas/StaffMember' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409':
          description: Ya existe alguien con ese nombre (`STAFF_NAME_EXISTS`) o el usuario ya está vinculado a otra persona (`STAFF_USER_LINKED`)
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
  /staff-members/options:
    get:
      tags: [Staff]
      summary: Opciones para el selector "Vendido por" (solo personas activas, sin datos de bono)
      description: '`isCurrentUser` marca a la persona vinculada al usuario autenticado, que el formulario de alta usa como valor por defecto.'
      x-roles: [ADMIN, RECEPCIONISTA]
      responses:
        '200':
          description: Opciones
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/StaffOption' } }
  /staff-members/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    patch:
      tags: [Staff]
      summary: Editar una persona del equipo (nombre, usuario vinculado, si cobra bono, activa)
      description: 'No se borra: para sacarla de las listas se marca `isActive = false`. Los meses ya publicados conservan la lista de elegibles congelada.'
      x-roles: [ADMIN]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/StaffMemberPatch' } } }
      responses:
        '200': { description: Actualizada, content: { application/json: { schema: { $ref: '#/components/schemas/StaffMember' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`STAFF_NAME_EXISTS` o `STAFF_USER_LINKED`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }

  # ───────────────────────── INCENTIVES (Fase 4, docs/03 §8) ─────────────────────────
  /incentives/history:
    get:
      tags: [Incentives]
      summary: Histórico mensual de altas con cobro, renovaciones, finanzas y objetivos publicados
      description: 'Calculado en vivo desde los datos (no usa los cierres de métricas). Antes de `metrics.cutover_period` la atribución de "Vendido por" es aproximada (se reconstruyó desde los leads).'
      x-roles: [ADMIN]
      parameters:
        - { in: query, name: from, schema: { type: string, pattern: '^\d{4}-\d{2}$' }, description: 'Default `incentives.history_start_period`' }
        - { in: query, name: to, schema: { type: string, pattern: '^\d{4}-\d{2}$' }, description: Default mes actual }
      responses:
        '200':
          description: Histórico
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IncentivesHistory' }
        '400': { $ref: '#/components/responses/ValidationError' }
  /incentives/plan:
    get:
      tags: [Incentives]
      summary: Propuesta de objetivo y bonos de un mes (simulador)
      description: 'Aplica la fórmula v1 (docs/03 §8) con los parámetros `incentives.*` y los reemplazos que lleguen por query. No guarda nada. El front nunca calcula: cada cambio del simulador vuelve a llamar a este endpoint.'
      x-roles: [ADMIN]
      parameters:
        - $ref: '#/components/parameters/Period'
        - { in: query, name: newMembersUpliftPct, schema: { type: number, minimum: 0, maximum: 100 } }
        - { in: query, name: renewalRateUpliftPts, schema: { type: number, minimum: -100, maximum: 100 } }
        - { in: query, name: newMemberBonusPct, schema: { type: number, minimum: 0, maximum: 100 } }
        - { in: query, name: teamBonusPct, schema: { type: number, minimum: 0, maximum: 100 } }
        - { in: query, name: expenseReferenceArs, schema: { type: number, minimum: 0 } }
        - { in: query, name: newMembersTarget, schema: { type: integer, minimum: 0 } }
        - { in: query, name: renewalRateTargetPct, schema: { type: number, minimum: 0, maximum: 100 } }
        - { in: query, name: bonusPerNewMemberArs, schema: { type: number, minimum: 0 } }
        - { in: query, name: teamBonusPerPersonArs, schema: { type: number, minimum: 0 } }
      responses:
        '200':
          description: Propuesta
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IncentivePlan' }
        '400': { $ref: '#/components/responses/ValidationError' }
  /incentives/periods/{period}:
    parameters: [{ $ref: '#/components/parameters/PeriodPath' }]
    get:
      tags: [Incentives]
      summary: Estado del mes (plan publicado o propuesta, progreso y liquidación)
      description: 'Siempre responde 200. Sin publicar → `status = DRAFT` y `plan` es la propuesta en vivo. Publicado → `plan` congelado y `progress` en vivo. Cerrado → `plan` y `progress` congelados (resultado final).'
      x-roles: [ADMIN]
      responses:
        '200':
          description: Detalle del mes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IncentivePeriodDetail' }
        '400': { $ref: '#/components/responses/ValidationError' }
  /incentives/periods/{period}/publish:
    parameters: [{ $ref: '#/components/parameters/PeriodPath' }]
    post:
      tags: [Incentives]
      summary: Publicar (congelar) el objetivo y los montos del mes en curso
      description: 'Solo el mes en curso. Con `replace = true` se puede volver a publicar mientras no esté cerrado (queda auditado). Si el resultado proyectado después de bonos es negativo exige `acceptNegativeResult = true`. Audita `PUBLISH` sobre `INCENTIVE_PERIOD`.'
      x-roles: [ADMIN]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PublishIncentivePeriodRequest' } } }
      responses:
        '200':
          description: Publicado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IncentivePeriodDetail' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409':
          description: 'Ya publicado sin `replace` (`INCENTIVE_ALREADY_PUBLISHED`), mes cerrado (`INCENTIVE_PERIOD_CLOSED`), no es el mes en curso (`INCENTIVE_PERIOD_NOT_EDITABLE`) o resultado negativo sin confirmar (`INCENTIVE_RESULT_NEGATIVE`)'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
  /incentives/periods/{period}/close:
    parameters: [{ $ref: '#/components/parameters/PeriodPath' }]
    post:
      tags: [Incentives]
      summary: Cerrar (liquidar) el mes y congelar el resultado de los bonos
      description: 'Se habilita desde `closableFrom` (último vencimiento del mes + días de gracia; en la práctica el día 16 del mes siguiente). Con `replace = true` recalcula un cierre existente. Audita `CLOSE_PERIOD` sobre `INCENTIVE_PERIOD`.'
      x-roles: [ADMIN]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CloseIncentivePeriodRequest' } } }
      responses:
        '200':
          description: Cerrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IncentivePeriodDetail' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409':
          description: 'No publicado (`INCENTIVE_NOT_PUBLISHED`), gracia de renovaciones pendiente (`INCENTIVE_GRACE_PENDING`) o ya cerrado sin `replace` (`INCENTIVE_PERIOD_CLOSED`)'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Id:
      in: path
      name: id
      required: true
      schema: { type: string, format: uuid }
    Page:
      in: query
      name: page
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      in: query
      name: pageSize
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    Period:
      in: query
      name: period
      description: Mes `YYYY-MM`. Default mes actual.
      schema: { type: string, pattern: '^\d{4}-\d{2}$', example: '2026-10' }
    PeriodPath:
      in: path
      name: period
      required: true
      description: Mes `YYYY-MM`
      schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$', example: '2026-11' }

  responses:
    Unauthorized:
      description: No autenticado o credenciales inválidas
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    Forbidden:
      description: Sin permisos para la operación (`FORBIDDEN`) o cambio de contraseña pendiente (`PASSWORD_CHANGE_REQUIRED`)
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    NotFound:
      description: Recurso inexistente
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    Conflict:
      description: Conflicto con el estado actual
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    ValidationError:
      description: DTO inválido (`VALIDATION_ERROR`, `details[]` por campo)
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    PasswordConfirmationInvalid:
      description: 'La contraseña de confirmación no coincide con la del usuario autenticado (`PASSWORD_CONFIRMATION_INVALID`). No cierra la sesión.'
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    TooManyRequests:
      description: Demasiados intentos
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }

  schemas:
    # ── Enums ──
    Role: { type: string, enum: [ADMIN, RECEPCIONISTA, NUTRICIONISTA, ALUMNO] }
    MemberStatus: { type: string, enum: [ACTIVE, CANCELLED] }
    RenewalStatus:
      type: string
      description: Estado de cuota (replica `classifyStatus`). Al día = OK; "cuota al día" = OK, DUE_7D, DUE_3D, DUE_TODAY.
      enum: [OK, DUE_7D, DUE_3D, DUE_TODAY, EXPIRED, UNKNOWN, CANCELLED]
    AttendanceRisk: { type: string, enum: [OK, MEDIUM, HIGH, CRITICAL, NO_ATTENDANCE] }
    MemberStatusEventType: { type: string, enum: [ACTIVATED, CANCELLED, REACTIVATED, AUTO_CANCELLED] }
    RecordStatus: { type: string, enum: [ACTIVE, VOIDED] }
    MovementType: { type: string, enum: [INCOME, EXPENSE] }
    MovementOrigin: { type: string, enum: [MANUAL, RENEWAL, IMPORT] }
    PaymentMethod: { type: string, enum: [CASH, TRANSFER, MERCADOPAGO, DEBIT, CREDIT, OTHER] }
    AttendanceSource: { type: string, enum: [WEB, MANUAL] }
    LeadStage: { type: string, enum: [FIRST_MESSAGE, SECOND_MESSAGE, TRIAL_ATTENDED, SIGNED_UP, LOST, NOT_INTERESTED] }
    LeadChannel: { type: string, enum: [WALK_IN, WHATSAPP, SOCIAL_MEDIA, REFERRAL, OTHER] }
    NutritionBilling:
      type: string
      description: 'Quién cobra el honorario de nutrición. D4: solo NutriPlan (FULLNUTR) es GYM; el resto NUTRITIONIST.'
      enum: [GYM, NUTRITIONIST]
    MethodologyVersion: { type: string, enum: [LEGACY_V3_7, V1] }
    MetricSource: { type: string, enum: [SNAPSHOT, LIVE] }
    AuditAction: { type: string, enum: [CREATE, UPDATE, VOID, DELETE, CANCEL, REACTIVATE, LOGIN, PASSWORD_CHANGE, CLOSE_PERIOD, PUBLISH] }
    AuditEntity: { type: string, enum: [USER, PLAN, MEMBER, MEMBERSHIP, CASH_MOVEMENT, CASH_CATEGORY, ATTENDANCE, LEAD, SETTING, METRIC_SNAPSHOT, STAFF_MEMBER, INCENTIVE_PERIOD] }
    IncentivePeriodStatus:
      type: string
      description: DRAFT = mes sin publicar (solo existe en la API); PUBLISHED = objetivo y montos congelados; CLOSED = bonos liquidados.
      enum: [DRAFT, PUBLISHED, CLOSED]

    # ── Comunes ──
    ErrorResponse:
      type: object
      required: [statusCode, code, message]
      properties:
        statusCode: { type: integer }
        code:
          type: string
          description: Código estable (VALIDATION_ERROR, UNAUTHORIZED, FORBIDDEN, PASSWORD_CHANGE_REQUIRED, PASSWORD_CONFIRMATION_INVALID, NOT_FOUND, MEMBER_NAME_EXISTS, DUPLICATE_CHECKIN, RECORD_VOIDED, STAFF_NAME_EXISTS, STAFF_USER_LINKED, STAFF_INACTIVE, INCENTIVE_ALREADY_PUBLISHED, INCENTIVE_PERIOD_CLOSED, INCENTIVE_PERIOD_NOT_EDITABLE, INCENTIVE_RESULT_NEGATIVE, INCENTIVE_NOT_PUBLISHED, INCENTIVE_GRACE_PENDING, …)
        message: { type: string }
        details:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }
              value: {}
        requestId: { type: string }
    PageMeta:
      type: object
      required: [page, pageSize, total]
      properties:
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
    VoidRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 3, maxLength: 300 }
    CashVoidRequest:
      allOf:
        - $ref: '#/components/schemas/VoidRequest'
        - type: object
          properties:
            confirmPassword:
              type: string
              writeOnly: true
              description: 'Obligatoria si el movimiento es un egreso (D5): contraseña del usuario autenticado.'
    UserRef:
      type: object
      nullable: true
      properties:
        id: { type: string, format: uuid }
        fullName: { type: string }
    AuditMeta:
      type: object
      properties:
        createdAt: { type: string, format: date-time }
        createdBy: { $ref: '#/components/schemas/UserRef' }
        updatedAt: { type: string, format: date-time }
        updatedBy: { $ref: '#/components/schemas/UserRef' }

    # ── Auth / Users ──
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    AuthTokens:
      type: object
      required: [accessToken, refreshToken, expiresIn]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        expiresIn: { type: integer, description: Segundos de vida del access token (900) }
    LoginResponse:
      allOf:
        - $ref: '#/components/schemas/AuthTokens'
        - type: object
          properties:
            user: { $ref: '#/components/schemas/User' }
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        fullName: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        isActive: { type: boolean }
        mustChangePassword: { type: boolean }
        lastLoginAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
    CreateUserRequest:
      type: object
      required: [email, fullName, role]
      properties:
        email: { type: string, format: email }
        fullName: { type: string, minLength: 2, maxLength: 120 }
        role: { $ref: '#/components/schemas/Role' }
    UpdateUserRequest:
      type: object
      properties:
        fullName: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        isActive: { type: boolean }
    CreatedUserResponse:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          properties:
            temporaryPassword: { type: string }

    # ── Plans ──
    Plan:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string, example: PLUS }
        name: { type: string, example: Plus (Challenge 90 dias) }
        priceArs: { type: number }
        enrollmentFeeArs: { type: number }
        durationDays: { type: integer }
        requiresAdvance: { type: boolean }
        advanceInstallments: { type: integer }
        benefits: { type: string, nullable: true }
        nutritionBilling: { $ref: '#/components/schemas/NutritionBilling' }
        isActive: { type: boolean }
        notes: { type: string, nullable: true }
        sortOrder: { type: integer }
    PlanInput:
      type: object
      properties:
        code: { type: string, pattern: '^[A-Z0-9_]{2,20}$' }
        name: { type: string, maxLength: 80 }
        priceArs: { type: number, minimum: 0 }
        enrollmentFeeArs: { type: number, minimum: 0 }
        durationDays: { type: integer, minimum: 1, maximum: 366 }
        requiresAdvance: { type: boolean }
        advanceInstallments: { type: integer, minimum: 0 }
        benefits: { type: string }
        nutritionBilling: { $ref: '#/components/schemas/NutritionBilling' }
        isActive: { type: boolean }
        notes: { type: string }
        sortOrder: { type: integer }

    # ── Members ──
    Member:
      type: object
      properties:
        id: { type: string, format: uuid }
        legacyCode: { type: string, example: LB045 }
        firstName: { type: string }
        lastName: { type: string }
        fullName: { type: string }
        phoneRaw: { type: string, nullable: true }
        phoneE164: { type: string, nullable: true, example: '+5491158593977' }
        phoneNeedsReview: { type: boolean }
        email: { type: string, nullable: true }
        joinedAt: { type: string, format: date }
        status: { $ref: '#/components/schemas/MemberStatus' }
        currentPlan:
          type: object
          nullable: true
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
        lastRenewalAt: { type: string, format: date, nullable: true }
        expiresAt: { type: string, format: date, nullable: true }
        daysToExpire: { type: integer, nullable: true, description: expiresAt − hoy en días calendario }
        renewalStatus: { $ref: '#/components/schemas/RenewalStatus' }
        cancelledAt: { type: string, format: date, nullable: true }
        cancellationReason: { type: string, nullable: true }
        acquisitionSource: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        soldBy:
          allOf: [{ $ref: '#/components/schemas/StaffRef' }]
          description: Persona del equipo que cerró la venta (Fase 4). Antes del corte puede ser aproximada o null.
        audit: { $ref: '#/components/schemas/AuditMeta' }
    MemberDetail:
      allOf:
        - $ref: '#/components/schemas/Member'
        - type: object
          properties:
            currentMembership: { $ref: '#/components/schemas/Membership' }
            lastAttendanceAt: { type: string, format: date-time, nullable: true }
            daysSinceLastAttendance: { type: integer, nullable: true }
            attendanceRisk: { $ref: '#/components/schemas/AttendanceRisk' }
            statusEvents: { type: array, items: { $ref: '#/components/schemas/MemberStatusEvent' } }
    MemberSummary:
      type: object
      description: Replica `counts` de `getRenovacionesData` y la hoja Dashboard
      properties:
        registered: { type: integer, description: Padrón no anulado }
        activeUpToDate: { type: integer, description: OK + DUE_7D + DUE_3D + DUE_TODAY con status ACTIVE }
        expired: { type: integer }
        dueToday: { type: integer }
        due3d: { type: integer }
        due7d: { type: integer }
        ok: { type: integer }
        unknown: { type: integer }
        cancelled: { type: integer }
        lastAutoCancellation:
          type: object
          nullable: true
          properties:
            ranAt: { type: string, format: date-time }
            applied: { type: integer }
    MemberStatusEvent:
      type: object
      properties:
        id: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/MemberStatusEventType' }
        effectiveOn: { type: string, format: date }
        reason: { type: string, nullable: true }
        createdBy: { $ref: '#/components/schemas/UserRef' }
        createdAt: { type: string, format: date-time }
    CreateMemberRequest:
      type: object
      required: [firstName, lastName, phone, planId]
      properties:
        firstName: { type: string, minLength: 1, maxLength: 60 }
        lastName: { type: string, minLength: 1, maxLength: 60 }
        phone: { type: string, minLength: 6, maxLength: 30 }
        email: { type: string, format: email, nullable: true }
        planId: { type: string, format: uuid }
        acquisitionSource: { type: string, maxLength: 120, nullable: true }
        notes: { type: string, maxLength: 1000, nullable: true }
        joinedAt: { type: string, format: date, description: Default fecha del pago inicial o hoy }
        soldByStaffId:
          type: string
          format: uuid
          description: 'Quién cerró la venta. Si no viene se usa la persona del equipo vinculada al usuario autenticado; si no hay ninguna → 400 VALIDATION_ERROR. La persona tiene que estar activa (400 STAFF_INACTIVE).'
        initialPayment:
          allOf:
            - $ref: '#/components/schemas/CreateMembershipRequest'
          description: Opcional (legacy "Crear y cobrar")
    UpdateMemberRequest:
      type: object
      properties:
        firstName: { type: string }
        lastName: { type: string }
        phone: { type: string, nullable: true }
        email: { type: string, format: email, nullable: true }
        currentPlanId: { type: string, format: uuid }
        expiresAt: { type: string, format: date, description: No puede ser anterior a lastRenewalAt }
        acquisitionSource: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        soldByStaffId:
          type: string
          format: uuid
          nullable: true
          description: 'Solo ADMIN (otro rol → 403 FORBIDDEN). null = "Sin asignar". La persona tiene que estar activa (400 STAFF_INACTIVE).'

    # ── Memberships ──
    PaymentSplit:
      type: object
      required: [method, amount]
      properties:
        method: { $ref: '#/components/schemas/PaymentMethod' }
        amount: { type: number, exclusiveMinimum: 0 }
    Membership:
      type: object
      properties:
        id: { type: string, format: uuid }
        legacyCode: { type: string, nullable: true, example: P0504 }
        member:
          type: object
          properties:
            id: { type: string, format: uuid }
            legacyCode: { type: string }
            fullName: { type: string }
        plan:
          type: object
          nullable: true
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
        planName: { type: string }
        startsOn: { type: string, format: date }
        expiresOn: { type: string, format: date }
        amountTotal: { type: number }
        splits: { type: array, items: { $ref: '#/components/schemas/PaymentSplit' } }
        cashMovementId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/RecordStatus' }
        voidedAt: { type: string, format: date-time, nullable: true }
        voidReason: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        audit: { $ref: '#/components/schemas/AuditMeta' }
    CreateMembershipRequest:
      type: object
      required: [planId, paidOn, expiresOn, splits]
      properties:
        planId: { type: string, format: uuid }
        paidOn: { type: string, format: date, description: Fecha de pago (= inicio del período). No futura. }
        expiresOn: { type: string, format: date, description: Sugerido paidOn + 30; debe ser ≥ paidOn }
        splits:
          type: array
          minItems: 1
          maxItems: 4
          items: { $ref: '#/components/schemas/PaymentSplit' }
          description: Métodos distintos entre sí; la suma es el monto total
        notes: { type: string, maxLength: 500 }
    UpdateMembershipRequest:
      type: object
      properties:
        planId: { type: string, format: uuid }
        paidOn: { type: string, format: date }
        expiresOn: { type: string, format: date }
        splits: { type: array, minItems: 1, maxItems: 4, items: { $ref: '#/components/schemas/PaymentSplit' } }
        notes: { type: string }

    # ── Attendances ──
    Attendance:
      type: object
      properties:
        id: { type: string, format: uuid }
        member:
          type: object
          properties:
            id: { type: string, format: uuid }
            legacyCode: { type: string }
            fullName: { type: string }
        checkedInAt: { type: string, format: date-time }
        checkedInOn: { type: string, format: date }
        source: { $ref: '#/components/schemas/AttendanceSource' }
        notes: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/RecordStatus' }
        voidReason: { type: string, nullable: true }
        audit: { $ref: '#/components/schemas/AuditMeta' }
    CreateAttendanceRequest:
      type: object
      required: [memberId]
      properties:
        memberId: { type: string, format: uuid }
        checkedInAt: { type: string, format: date-time, description: Solo para carga manual/retroactiva; requiere notes }
        notes: { type: string, maxLength: 300 }
        force: { type: boolean, default: false, description: Permite un segundo check-in el mismo día }
    AttendanceRiskRow:
      type: object
      properties:
        member: { $ref: '#/components/schemas/Member' }
        lastAttendanceAt: { type: string, format: date-time, nullable: true }
        daysSinceLastAttendance: { type: integer, description: 'Si nunca vino, días desde el alta' }
        neverAttended: { type: boolean }
        risk: { $ref: '#/components/schemas/AttendanceRisk' }
        suggestedTemplate: { type: string, enum: [ausente, inasistencia_alta, inasistencia_critica] }

    # ── Cash ──
    CashCategory:
      type: object
      properties:
        id: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/MovementType' }
        name: { type: string }
        isActive: { type: boolean }
        isSystem: { type: boolean }
        notes: { type: string, nullable: true }
        sortOrder: { type: integer }
    CashCategoryInput:
      type: object
      properties:
        type: { $ref: '#/components/schemas/MovementType' }
        name: { type: string, maxLength: 60 }
        isActive: { type: boolean }
        notes: { type: string }
        sortOrder: { type: integer }
    CashMovement:
      type: object
      properties:
        id: { type: string, format: uuid }
        legacyCode: { type: string, nullable: true, example: MV0085 }
        occurredOn: { type: string, format: date }
        type: { $ref: '#/components/schemas/MovementType' }
        category: { $ref: '#/components/schemas/CashCategory' }
        subcategory: { type: string, nullable: true }
        amount: { type: number }
        splits: { type: array, items: { $ref: '#/components/schemas/PaymentSplit' } }
        description: { type: string, nullable: true }
        member:
          type: object
          nullable: true
          properties:
            id: { type: string, format: uuid }
            legacyCode: { type: string }
            fullName: { type: string }
        origin: { $ref: '#/components/schemas/MovementOrigin' }
        membershipId: { type: string, format: uuid, nullable: true }
        status: { $ref: '#/components/schemas/RecordStatus' }
        voidedAt: { type: string, format: date-time, nullable: true }
        voidReason: { type: string, nullable: true }
        audit: { $ref: '#/components/schemas/AuditMeta' }
    CashMovementRow:
      description: Fila de la tabla de caja. Con `expandSplits=true` hay una fila por split (`splitIndex`, `method`, `amount` del split); con false una por movimiento (`method` = null si tiene varios).
      allOf:
        - $ref: '#/components/schemas/CashMovement'
        - type: object
          properties:
            splitIndex: { type: integer, nullable: true }
            method: { $ref: '#/components/schemas/PaymentMethod' }
            rowAmount: { type: number }
            signedAmount: { type: number, description: 'Positivo ingresos, negativo egresos' }
    CashTotals:
      type: object
      description: Calculado en SQL sobre el conjunto filtrado completo
      properties:
        income: { type: number }
        expense: { type: number }
        net: { type: number }
        count: { type: integer }
        renewalCount: { type: integer }
        incomeByMethod: { type: object, additionalProperties: { type: number } }
        expenseByMethod: { type: object, additionalProperties: { type: number } }
        incomeByCategory: { type: object, additionalProperties: { type: number } }
        expenseByCategory: { type: object, additionalProperties: { type: number } }
    CreateCashMovementRequest:
      type: object
      required: [type, categoryId, amount, splits]
      if:
        properties: { type: { const: EXPENSE } }
      then:
        required: [confirmPassword, description]
      properties:
        confirmPassword:
          type: string
          writeOnly: true
          description: 'Obligatoria para EXPENSE (D5): contraseña del usuario autenticado. No se persiste.'
        type: { $ref: '#/components/schemas/MovementType' }
        occurredOn: { type: string, format: date, description: Default hoy; no futura }
        categoryId: { type: string, format: uuid }
        subcategory: { type: string, maxLength: 80 }
        amount: { type: number, exclusiveMinimum: 0 }
        splits: { type: array, minItems: 1, maxItems: 4, items: { $ref: '#/components/schemas/PaymentSplit' } }
        description: { type: string, maxLength: 500, description: Obligatoria para EXPENSE }
        memberId: { type: string, format: uuid, nullable: true }
    UpdateCashMovementRequest:
      type: object
      properties:
        confirmPassword:
          type: string
          writeOnly: true
          description: 'Obligatoria si el movimiento editado es un egreso (D5): contraseña del usuario autenticado.'
        occurredOn: { type: string, format: date }
        categoryId: { type: string, format: uuid }
        subcategory: { type: string, nullable: true }
        amount: { type: number, exclusiveMinimum: 0 }
        splits: { type: array, minItems: 1, maxItems: 4, items: { $ref: '#/components/schemas/PaymentSplit' } }
        description: { type: string, nullable: true }
        memberId: { type: string, format: uuid, nullable: true }

    # ── Metrics ──
    MetricValue:
      type: object
      required: [key, value, methodologyVersion, source]
      properties:
        key: { type: string, example: churn_pct }
        value: { type: number, nullable: true }
        methodologyVersion: { $ref: '#/components/schemas/MethodologyVersion' }
        source: { $ref: '#/components/schemas/MetricSource' }
        isProvisional: { type: boolean }
        delta:
          type: object
          nullable: true
          description: Variación vs. mes anterior (null si no hay comparable)
          properties:
            absolute: { type: number }
            relativePct: { type: number, nullable: true }
            lowerIsBetter: { type: boolean }
    PeriodInfo:
      type: object
      properties:
        period: { type: string, example: '2026-09' }
        isCurrentMonth: { type: boolean }
        isClosed: { type: boolean }
        closeStage: { type: string, enum: [PRELIMINARY, FINAL], nullable: true }
        isReconstructed: { type: boolean, description: 'Período anterior a cutoverPeriod: métricas reconstruidas desde la importación del Excel (D1)' }
        methodologyVersion: { $ref: '#/components/schemas/MethodologyVersion' }
        closedAt: { type: string, format: date-time, nullable: true }
        closedBy: { type: string, nullable: true }
        hasLegacySnapshot: { type: boolean }
    MonthlyMetrics:
      type: object
      properties:
        period: { type: string }
        previousPeriod: { type: string }
        isCurrentMonth: { type: boolean }
        isClosed: { type: boolean }
        isReconstructed: { type: boolean }
        source: { $ref: '#/components/schemas/MetricSource' }
        methodologyVersion: { $ref: '#/components/schemas/MethodologyVersion', description: Versión predominante del período }
        cutoverPeriod: { type: string }
        snapshot: { $ref: '#/components/schemas/MetricSnapshotInfo' }
        changesAfterClose: { type: integer, description: 'Cargas, ediciones o anulaciones con fecha del mes registradas después del cierre definitivo' }
        values:
          type: object
          description: Métricas del mes indexadas por clave (ver 03-especificacion-metricas)
          additionalProperties: { $ref: '#/components/schemas/MetricValue' }
        previousValues:
          type: object
          additionalProperties: { $ref: '#/components/schemas/MetricValue' }
        breakdowns:
          type: object
          properties:
            incomeByMethod: { type: object, additionalProperties: { type: number } }
            incomeByCategory: { type: object, additionalProperties: { type: number } }
            expenseByCategory: { type: object, additionalProperties: { type: number } }
            leadsByStage: { type: object, additionalProperties: { type: integer } }
        parameters:
          type: object
          description: Valores de settings usados (congelados en el snapshot)
          properties:
            fixedCosts: { type: object, additionalProperties: { type: number } }
            fixedCostsTotal: { type: number }
            marketRent: { type: number }
            renewalGraceDays: { type: integer }
            goals:
              type: object
              properties:
                members: { type: integer }
                churnPct: { type: number }
                avgTicket: { type: number }
        generatedAt: { type: string, format: date-time }
    MetricsHistory:
      type: object
      properties:
        from: { type: string }
        to: { type: string }
        cutoverPeriod: { type: string }
        series:
          type: array
          items:
            type: object
            properties:
              key: { type: string }
              points:
                type: array
                items:
                  type: object
                  properties:
                    period: { type: string }
                    value: { type: number, nullable: true }
                    methodologyVersion: { $ref: '#/components/schemas/MethodologyVersion' }
                    source: { $ref: '#/components/schemas/MetricSource' }
                    isProvisional: { type: boolean }
                    isReconstructed: { type: boolean }
    MetricDefinition:
      type: object
      properties:
        key: { type: string }
        name: { type: string, description: Nombre en español para la UI }
        group: { type: string, enum: [members, finance, attendance, leads, operational] }
        unit: { type: string, enum: [count, ars, pct, months, ratio] }
        description: { type: string, description: Qué representa (texto del ícono de información) }
        variables: { type: array, items: { type: string } }
        formulaV1: { type: string }
        formulaLegacy: { type: string, nullable: true }
        lowerIsBetter: { type: boolean }
        decimals: { type: integer }
    MetricSnapshotInfo:
      type: object
      nullable: true
      properties:
        id: { type: string, format: uuid }
        period: { type: string }
        closedAt: { type: string, format: date-time }
        closedBy: { type: string, nullable: true }
        source: { type: string, enum: [IMPORT, AUTO, MANUAL] }
        stage: { type: string, enum: [PRELIMINARY, FINAL, REFERENCE] }
        isCurrent: { type: boolean }
        supersededAt: { type: string, format: date-time, nullable: true }
        legacyLabel: { type: string, nullable: true }
        notes: { type: string, nullable: true }

    # ── Nutrition ──
    NutritionMemberRow:
      type: object
      properties:
        id: { type: string, format: uuid }
        legacyCode: { type: string }
        fullName: { type: string }
        status: { $ref: '#/components/schemas/MemberStatus' }
        plan:
          type: object
          nullable: true
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            nutritionBilling: { $ref: '#/components/schemas/NutritionBilling' }
        planSource: { type: string, enum: [CURRENT_MEMBERSHIP, MEMBER_PLAN, NONE], description: De dónde sale el plan mostrado }
        membershipStartsOn: { type: string, format: date, nullable: true }
        membershipExpiresOn: { type: string, format: date, nullable: true }
        renewalStatus: { $ref: '#/components/schemas/RenewalStatus' }

    # ── Leads ──
    Lead:
      type: object
      properties:
        id: { type: string, format: uuid }
        legacyCode: { type: string, nullable: true }
        contactedOn: { type: string, format: date }
        firstName: { type: string }
        lastName: { type: string, nullable: true }
        fullName: { type: string }
        phoneRaw: { type: string, nullable: true }
        phoneE164: { type: string, nullable: true }
        channel: { $ref: '#/components/schemas/LeadChannel' }
        channelDetail: { type: string, nullable: true }
        trialClassOn: { type: string, format: date, nullable: true }
        trialClassTime: { type: string, pattern: '^\d{2}:\d{2}$', nullable: true }
        stage: { $ref: '#/components/schemas/LeadStage' }
        handledBy: { $ref: '#/components/schemas/UserRef' }
        handledByName: { type: string, nullable: true }
        lostReason: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        memberId: { type: string, format: uuid, nullable: true }
        audit: { $ref: '#/components/schemas/AuditMeta' }
    LeadInput:
      type: object
      properties:
        contactedOn: { type: string, format: date }
        firstName: { type: string, minLength: 1 }
        lastName: { type: string, nullable: true }
        phone: { type: string, nullable: true, description: Obligatorio si channel es OTHER sin channelDetail }
        channel: { $ref: '#/components/schemas/LeadChannel' }
        channelDetail: { type: string, nullable: true }
        trialClassOn: { type: string, format: date, nullable: true }
        trialClassTime: { type: string, pattern: '^\d{2}:\d{2}$', nullable: true }
        stage: { $ref: '#/components/schemas/LeadStage' }
        handledByUserId: { type: string, format: uuid, nullable: true }
        lostReason: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        memberId: { type: string, format: uuid, nullable: true }
    LeadsSummary:
      type: object
      properties:
        period: { type: string }
        total: { type: integer }
        signedUp: { type: integer }
        inProgress: { type: integer }
        lost: { type: integer }
        notInterested: { type: integer }
        signedUpPct: { type: number, nullable: true }
        inProgressPct: { type: number, nullable: true }
        notClosedPct: { type: number, nullable: true }
        byStage: { type: object, additionalProperties: { type: integer } }
        previous: { type: object, nullable: true, description: Mismas propiedades para el mes anterior, additionalProperties: true }

    # ── Audit ──
    AuditLog:
      type: object
      properties:
        id: { type: string, format: uuid }
        occurredAt: { type: string, format: date-time }
        user: { $ref: '#/components/schemas/UserRef' }
        actorLabel: { type: string, example: Mariel }
        entity: { $ref: '#/components/schemas/AuditEntity' }
        entityId: { type: string, format: uuid }
        entityLabel: { type: string, example: 'LB045 – Juan Pérez' }
        action: { $ref: '#/components/schemas/AuditAction' }
        before: { type: object, nullable: true, additionalProperties: true }
        after: { type: object, nullable: true, additionalProperties: true }
        changedFields: { type: array, items: { type: string } }
        passwordConfirmed: { type: boolean, description: 'La operación se confirmó reingresando la contraseña del usuario (egresos, D5)' }
        requestId: { type: string, nullable: true }

    # ── Settings ──
    Setting:
      type: object
      properties:
        key: { type: string, example: finance.market_rent }
        value: {}
        valueType: { type: string, enum: [number, string, json, array] }
        group: { type: string, example: finance }
        label: { type: string }
        description: { type: string, nullable: true }
        updatedAt: { type: string, format: date-time }
        updatedBy: { $ref: '#/components/schemas/UserRef' }

    # ── Equipo y objetivos (Fase 4, docs/03 §8) ──
    StaffRef:
      type: object
      nullable: true
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string }
    StaffMember:
      type: object
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string, example: Maru }
        user: { $ref: '#/components/schemas/UserRef' }
        isBonusEligible: { type: boolean }
        isActive: { type: boolean }
        sortOrder: { type: integer }
        notes: { type: string, nullable: true }
        audit: { $ref: '#/components/schemas/AuditMeta' }
    StaffMemberInput:
      type: object
      required: [displayName]
      properties:
        displayName: { type: string, minLength: 2, maxLength: 60 }
        userId: { type: string, format: uuid, nullable: true, description: Usuario vinculado (opcional; uno por persona) }
        isBonusEligible: { type: boolean, default: false }
        isActive: { type: boolean, default: true }
        sortOrder: { type: integer, minimum: 0, default: 0 }
        notes: { type: string, maxLength: 300, nullable: true }
    StaffMemberPatch:
      type: object
      properties:
        displayName: { type: string, minLength: 2, maxLength: 60 }
        userId: { type: string, format: uuid, nullable: true }
        isBonusEligible: { type: boolean }
        isActive: { type: boolean }
        sortOrder: { type: integer, minimum: 0 }
        notes: { type: string, maxLength: 300, nullable: true }
    StaffOption:
      type: object
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string }
        isCurrentUser: { type: boolean }
    IncentiveWarningCode:
      type: string
      enum: [NO_HISTORY, FEW_HISTORY_MONTHS, PROVISIONAL_RENEWAL_DATA, NO_RENEWAL_RATE, EXPENSES_NOT_AVAILABLE, COST_STRUCTURE_CHANGED, TARGET_RAISED_TO_BREAKEVEN, TARGET_ABOVE_HISTORY, RESULT_NEGATIVE, NO_ELIGIBLE_STAFF, DATA_GAP_PREVIOUS_MONTH, UNASSIGNED_NEW_MEMBERS, CAP_APPLIED]
    IncentiveWarning:
      type: object
      required: [code, severity, message]
      properties:
        code: { $ref: '#/components/schemas/IncentiveWarningCode' }
        severity: { type: string, enum: [info, warning] }
        message: { type: string, description: Texto en español para mostrar tal cual }
    IncentiveOverrides:
      type: object
      description: Reemplazos del simulador. Lo que no venga sale de los parámetros `incentives.*`.
      properties:
        newMembersUpliftPct: { type: number, minimum: 0, maximum: 100 }
        renewalRateUpliftPts: { type: number, minimum: -100, maximum: 100 }
        newMemberBonusPct: { type: number, minimum: 0, maximum: 100 }
        teamBonusPct: { type: number, minimum: 0, maximum: 100 }
        expenseReferenceArs: { type: number, minimum: 0 }
        newMembersTarget: { type: integer, minimum: 0 }
        renewalRateTargetPct: { type: number, minimum: 0, maximum: 100 }
        bonusPerNewMemberArs: { type: number, minimum: 0 }
        teamBonusPerPersonArs: { type: number, minimum: 0 }
    StaffCount:
      type: object
      properties:
        staff: { $ref: '#/components/schemas/StaffRef' }
        count: { type: integer }
    IncentiveMonth:
      type: object
      description: Un mes del histórico. "Altas con cobro" = primer pago del socio (docs/03 §8 regla 1); las renovaciones no incluyen altas.
      properties:
        period: { type: string, example: '2026-10' }
        isBeforeHistoryStart: { type: boolean, description: 'Anterior a `incentives.history_start_period` (p. ej. abril, con la carga inicial): se muestra pero no entra en los cálculos' }
        attributionApproximate: { type: boolean, description: 'Anterior a `metrics.cutover_period`: "Vendido por" reconstruido desde los leads' }
        newMembers: { type: integer }
        newMembersAmount: { type: number }
        newMembersByStaff: { type: array, items: { $ref: '#/components/schemas/StaffCount' } }
        newMembersUnassigned: { type: integer }
        renewalPayments: { type: integer, description: Pagos del mes que no son alta }
        renewalPaymentsAmount: { type: number }
        expirations: { type: integer, nullable: true, description: Cuotas que vencen en el mes (lógica V1) }
        renewed: { type: integer, nullable: true, description: De esas, cuántas renovaron dentro de la gracia }
        renewalRatePct: { type: number, nullable: true }
        renewalIsFinal: { type: boolean, description: La gracia ya venció (la tasa no cambia más) }
        otherIncome: { type: number }
        expenses: { type: number }
        expensesComplete: { type: boolean, description: 'Tiene egresos en "Alquiler" y en "Sueldos y liquidaciones"' }
        margin: { type: number, description: Ingresos totales − egresos }
        incentive:
          type: object
          nullable: true
          description: Objetivo publicado del mes, si existe
          properties:
            status: { $ref: '#/components/schemas/IncentivePeriodStatus' }
            newMembersTarget: { type: integer }
            renewalRateTargetPct: { type: number }
            renewalsTarget: { type: integer }
            newMembersAchieved: { type: boolean, nullable: true }
            renewalsAchieved: { type: boolean, nullable: true }
            totalBonusesArs: { type: number, nullable: true }
    IncentivesHistory:
      type: object
      properties:
        from: { type: string }
        to: { type: string }
        cutoverPeriod: { type: string, example: '2026-11' }
        months: { type: array, items: { $ref: '#/components/schemas/IncentiveMonth' } }
    IncentivePlan:
      type: object
      description: Resultado de la fórmula v1 para un mes (docs/03 §8). Se congela tal cual al publicar.
      properties:
        period: { type: string, example: '2026-11' }
        formulaVersion: { type: string, example: '1' }
        generatedAt: { type: string, format: date-time }
        window:
          type: object
          properties:
            periods: { type: array, items: { type: string }, description: Meses de la ventana W }
            renewalRatePeriods: { type: array, items: { type: string }, description: Meses de W con la gracia vencida }
            ticketPeriods: { type: array, items: { type: string } }
            expenseReferencePeriods: { type: array, items: { type: string } }
        inputs:
          type: object
          properties:
            newMembersByPeriod:
              type: array
              items:
                type: object
                properties:
                  period: { type: string }
                  count: { type: integer }
            newMembersMedian: { type: number, nullable: true }
            renewalRateHistPct: { type: number, nullable: true }
            expectedExpirations: { type: integer }
            extraRenewalPayments: { type: integer }
            ticketNewMember: { type: number, nullable: true }
            ticketRenewal: { type: number, nullable: true }
            otherIncome: { type: number }
            expenseReferenceArs: { type: number, nullable: true }
            expenseReferenceSource: { type: string, enum: [AUTO, SETTING, OVERRIDE, NONE] }
            lastCompleteMonthExpenses: { type: number, nullable: true }
            eligibleStaff: { type: array, items: { $ref: '#/components/schemas/StaffRef' } }
        targets:
          type: object
          properties:
            newMembersStatistical: { type: integer }
            newMembersBreakeven: { type: integer, nullable: true }
            newMembers: { type: integer, description: Objetivo final de altas }
            newMembersSource: { type: string, enum: [STATISTICAL, BREAKEVEN, OVERRIDE] }
            newMembersAchievedMonths: { type: integer, description: Meses de W que llegaron al objetivo }
            renewalRateTargetPct: { type: number, description: Tasa congelada con 2 decimales }
            renewals: { type: integer, description: Mínimo de renovaciones = ceil(vencimientos × tasa) }
            renewalRateAchievedMonths: { type: integer }
        amounts:
          type: object
          properties:
            bonusPerNewMemberArs: { type: number }
            teamBonusPerPersonArs: { type: number }
            teamBonusTotalArs: { type: number }
            newMemberBonusesAtTargetArs: { type: number }
            totalAtTargetArs: { type: number }
            capArs: { type: number, nullable: true }
        projection:
          type: object
          properties:
            incomeNewMembers: { type: number }
            incomeRenewals: { type: number }
            incomeExtraRenewals: { type: number }
            incomeOther: { type: number }
            incomeTotal: { type: number }
            expenses: { type: number, nullable: true }
            bonuses: { type: number }
            resultBeforeBonuses: { type: number, nullable: true }
            resultAfterBonuses: { type: number, nullable: true }
            breakevenPayments: { type: integer, nullable: true, description: Cobros necesarios para resultado 0 sin bonos }
        settings:
          type: object
          additionalProperties: {}
          description: Valores de `incentives.*` usados
        overrides: { $ref: '#/components/schemas/IncentiveOverrides' }
        warnings: { type: array, items: { $ref: '#/components/schemas/IncentiveWarning' } }
        acceptedNegativeResult: { type: boolean }
    IncentiveStaffResult:
      type: object
      properties:
        staff: { $ref: '#/components/schemas/StaffRef' }
        isBonusEligible: { type: boolean }
        newMembers: { type: integer }
        newMemberBonusArs: { type: number }
        teamBonusArs: { type: number }
        totalArs: { type: number }
    IncentiveNewMember:
      type: object
      properties:
        memberId: { type: string, format: uuid }
        legacyCode: { type: string }
        fullName: { type: string }
        paidOn: { type: string, format: date }
        amount: { type: number }
        planName: { type: string }
        soldBy: { $ref: '#/components/schemas/StaffRef' }
    IncentiveProgress:
      type: object
      description: Avance del mes (en vivo) o resultado final congelado al cerrar.
      properties:
        asOf: { type: string, format: date }
        isFinal: { type: boolean }
        newMembers:
          type: object
          properties:
            actual: { type: integer }
